<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    margin:0;
    padding:0;
}
/*导航外层：背景全屏左右拉伸*/
.nav {
    width:100%;
    background:#2C9AB7;
}
/*导航内层容器，内容居中，最大宽度1200px*/
.nav-inner{
    max-width:1200px;
    margin:0 auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    gap:24px;
}
.nav-inner img{
    height:80px;
}
/* PC端菜单链接样式不变 */
.nav-menu{
    display:flex;
    gap:24px;
    list-style:none;
    align-items:center;
}
.nav-menu li a{
    text-decoration: none;
    color:#fff;
    font-size:16px;
	font-weight: bold;
}
.nav-menu li a:hover{
    text-decoration: none;
    color:#0066cc;
}
/*汉堡按钮，电脑端隐藏*/
.hamburger{
    display:none;
    border:none;
    background:#fff;
    color:#2C9AB7;
    padding:8px 12px;
    font-size:20px;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
}

/* ===== 横幅区域（全屏背景，文字/图片居中）===== */
.banner{
    width:100%;
    background:#f0f7ff; /*横幅背景色，可以自行修改，也可以放图片*/
    padding:60px 20px;
}
.banner-inner{
    max-width:1200px;
    margin:0 auto;
}
.banner h1{
    font-size:32px;
    color:#222;
    margin-bottom:12px;
}
.banner p{
    font-size:18px;
    color:#444;
}

/*正文链接保留下划线：text-decoration:underline*/
.content a{
    color:#0066cc;
	text-decoration:none;
}
.content a:visited{
    color:#0066cc;
	}
.content a:hover{
    color:#570a66;
}
.content{
    max-width:1200px;
    margin:0 auto;
    padding:30px 20px;
}
footer{
    width:100%;
	color:#fff;
    background:#2C9AB7;
    margin-top:40px;
}
.footer-inner{
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

/* ==========手机媒体查询【重点！小于768px生效】========== */
@media (max-width:768px){
    .nav-inner{
        flex-wrap:wrap;
        justify-content:space-between;
    }
    /*PC横向菜单隐藏*/
    .nav-menu{
        display:none;
        width:100%;
        margin-top:15px;
        flex-direction:column;
        gap:0;
    }
    /*汉堡按钮显示出来*/
    .hamburger{
        display:block;
    }
    /*点击后激活展开菜单*/
    .nav-menu.active{
        display:flex;
    }
    .nav-menu li{
        padding:12px 0;
        text-align:center;
    }
}
</style>
